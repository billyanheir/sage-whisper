{% if brd and brd.status == 'generating' %}
<!-- Still generating - keep polling -->
<div hx-get="/partials/brd-status/{{ brd.id }}"
     hx-trigger="every 2s"
     hx-swap="innerHTML"
     hx-target="#brd-content">
    <div class="card-elevated rounded-2xl p-12 text-center">
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-cyan-500/10 mb-4">
            <svg class="w-8 h-8 text-cyan-400 animate-spin" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
        </div>
        <h2 class="text-xl font-semibold text-white mb-2">Generating BRD...</h2>
        <p class="text-gray-400">Analyzing transcript and extracting requirements with Ollama</p>
    </div>
</div>
{% elif brd and brd.status in ['review', 'finalized'] %}
<!-- Generation complete - redirect to reload page with full wizard -->
<script>window.location.reload();</script>
{% else %}
<div class="card-elevated rounded-2xl p-8 text-center">
    <p class="text-gray-400">BRD not found.</p>
</div>
{% endif %}
